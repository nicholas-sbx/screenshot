# Runs only for release commits: a push to main that changes
# flatshot/__init__.py (where __version__ lives). Tests, packages and
# install checks must all pass; then, if there is no v<version> tag yet,
# the packages are published as a GitHub release. "Run workflow" in the
# Actions tab runs it on demand.
name: build

on:
  push:
    branches: [main]
    paths: [flatshot/__init__.py]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: "2.43.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(sed -nE 's/^__version__ = "(.*)"/\1/p' flatshot/__init__.py)
          [ -n "$version" ] || { echo "::error::no __version__ in flatshot/__init__.py"; exit 1; }
          release=false
          if [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $version, release: $release" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.binding }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        binding: [pyside6, pyqt6]
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 weston \
            xvfb dbus-x11 dunst libkf5globalaccel-bin
      - name: PySide6 from PyPI
        if: matrix.binding == 'pyside6'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q PySide6-Essentials zxing-cpp jeepney
          echo "PY=$PWD/.venv/bin/python" >> "$GITHUB_ENV"
      - name: PyQt6 from Ubuntu
        if: matrix.binding == 'pyqt6'
        run: |
          sudo apt-get install -y -q python3-pyqt6 python3-zxing-cpp python3-jeepney
          echo "PY=/usr/bin/python3" >> "$GITHUB_ENV"
          echo "FLATSHOT_QT=pyqt6" >> "$GITHUB_ENV"
      - name: Compile
        run: $PY -m compileall -q flatshot
      - name: Self-test (offscreen)
        run: QT_QPA_PLATFORM=offscreen FLATSHOT_SELFTEST_OUT=shots $PY -m flatshot --self-test
      - name: Self-test (Wayland, headless weston)
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless --socket=wl-ci --width=1920 --height=1080 &
          sleep 2
          WAYLAND_DISPLAY=wl-ci QT_QPA_PLATFORM=wayland timeout 120 $PY -m flatshot --self-test
      - name: KDE shortcuts, notifications and tray (kglobalaccel + dunst)
        run: timeout 300 tests/desktop_services.sh $PY
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.binding }}
          path: shots/

  layer-shell:
    # The overlay as a wlr-layer-shell surface (no KWin window animations),
    # checked on Sway with Debian's PyQt6 + LayerShellQt.
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -q
          apt-get install -y -q python3-pyqt6 python3-jeepney python3-zxing-cpp qt6-wayland sway fonts-dejavu-core
          pkgs=$(apt-cache search --names-only 'layer-?shell-?qt|layershellqt' | awk '{print $1}' | grep -v -- '-dev$' || true)
          echo "LayerShellQt packages: $pkgs"
          apt-get install -y -q $pkgs
      - name: Self-test on Sway (headless) as a layer-shell overlay
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 sway -c /dev/null > sway.log 2>&1 &
          for i in $(seq 50); do ls "$XDG_RUNTIME_DIR" | grep -q '^wayland-[0-9]*$' && break; sleep 0.2; done
          export WAYLAND_DISPLAY=$(ls "$XDG_RUNTIME_DIR" | grep '^wayland-[0-9]*$' | head -n1)
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
          QT_QPA_PLATFORM=wayland FLATSHOT_QT=pyqt6 FLATSHOT_LAYER_SHELL=1 FLATSHOT_EXPECT_LAYER_SHELL=1 \
            timeout 120 python3 -m flatshot --self-test
      - if: failure()
        run: cat sway.log || true

  packages:
    needs: [version, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb
      - run: ./packaging/build-packages.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  appimage:
    needs: [version, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 weston
      - run: ./packaging/build-appimage.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Self-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=$(ls dist/*.AppImage)
          QT_QPA_PLATFORM=offscreen "$app" --self-test
          export XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless --socket=wl-ci --width=1920 --height=1080 &
          sleep 2
          WAYLAND_DISPLAY=wl-ci QT_QPA_PLATFORM=wayland timeout 120 "$app" --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  install:
    name: install (${{ matrix.image }})
    needs: packages
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            install: apt-get update -q && apt-get install -y -q ./dist/*.deb
          - image: debian:trixie
            install: apt-get update -q && apt-get install -y -q ./dist/*.deb
          - image: debian:bookworm
            install: apt-get update -q && apt-get install -y -q ./dist/*.deb
          - image: fedora:latest
            install: dnf install -y ./dist/*.rpm
          - image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Install package
        env:
          DEBIAN_FRONTEND: noninteractive
        run: ${{ matrix.install }}
      - name: Self-test installed package
        run: |
          command -v flatshot
          flatshot --version
          QT_QPA_PLATFORM=offscreen flatshot --self-test

  release:
    needs: [version, packages, appimage, install, layer-shell]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Flatshot ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
