[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flatshot"
dynamic = ["version"]
description = "ShareX-style region screenshots for Wayland/KDE with a floating draw toolbar and QR/barcode scanning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5",
    "zxing-cpp>=2.2",
]

[project.urls]
Homepage = "https://github.com/nicholas-sbx/screenshot"

[project.scripts]
flatshot = "flatshot.app:main"

[tool.setuptools]
packages = ["flatshot"]

[tool.setuptools.dynamic]
version = { attr = "flatshot.__version__" }
